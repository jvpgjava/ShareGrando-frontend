<main class="shell login">
  <section class="card">
    <div class="brand">
      SCREEN
      <span>GRANDO</span>
    </div>
    <p class="eyebrow">TRANSMISSÃO SEGURA</p>
    <h1>Acesse o ScreenGrando</h1>
    <p class="muted">Entre com sua conta corporativa para iniciar uma transmissão.</p>
    <form (ngSubmit)="submit()">
      <label class="field">
        E-mail
        <input name="email" type="email" autocomplete="username" [(ngModel)]="email" required />
      </label>
      <label class="field">
        Senha
        <input
          name="password"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          required
        />
      </label>
      <button class="btn primary full" [disabled]="busy()">
        {{ busy() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
    <p class="muted foot">Grando Consult · Porto Alegre</p>
  </section>
</main>
